<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>ESP8266 LED Control</title>

<style>

* {
    box-sizing: border-box;
}

body {

    font-family: Arial, sans-serif;

    text-align: center;

    background: #101827;

    color: white;

    margin: 0;

    padding: 50px 15px;

}

.container {

    background: #1e293b;

    padding: 30px 20px;

    margin: auto;

    max-width: 450px;

    border-radius: 20px;

    box-shadow: 0 10px 30px #0005;

}

h1 {

    color: #38bdf8;

}

.hero-icon {

    font-size: 65px;

    margin: 20px;

}

#status {

    font-size: 26px;

    font-weight: bold;

    margin-top: 25px;

}

button {

    padding: 16px 45px;

    font-size: 20px;

    border: none;

    border-radius: 12px;

    color: white;

    cursor: pointer;

    margin-top: 25px;

}

.on {

    background: #dc2626;

}

.off {

    background: #16a34a;

}

button:disabled {

    opacity: 0.5;

}

#connection {

    font-size: 14px;

    margin-top: 25px;

    color: #94a3b8;

}

.info {

    background: #334155;

    padding: 15px;

    border-radius: 12px;

    margin-top: 25px;

    font-size: 14px;

    line-height: 1.8;

}

</style>

</head>

<body>

<div class="container">

    <h1>ESP8266 LED Control</h1>

    <div class="hero-icon">💡</div>

    <h2>Built-in LED</h2>

    <p id="status">Checking LED...</p>

    <button id="ledButton"
    class="off"
    onclick="toggleLED()"
    disabled>

        LED ON

    </button>

    <p id="connection">
        Connecting to ESP8266...
    </p>

    <div class="info">

        <strong>Device Information</strong>

        <br>

        Device: ESP8266

        <br>

        WiFi: ESP8266_LED

        <br>

        IP: 192.168.4.1

    </div>

</div>

<script>

const ESP_URL = "";

let led = false;

let connected = false;

let busy = false;

const button =
document.getElementById("ledButton");

const status =
document.getElementById("status");

const connection =
document.getElementById("connection");


// =====================================
// Update LED Interface
// =====================================

function updateUI() {

    if (led) {

        status.innerHTML = "LED is ON";

        status.style.color = "#4ade80";

        button.innerHTML = "LED OFF";

        button.className = "on";

    }

    else {

        status.innerHTML = "LED is OFF";

        status.style.color = "#f87171";

        button.innerHTML = "LED ON";

        button.className = "off";

    }

}


// =====================================
// Connection Status
// =====================================

function updateConnection(state) {

    connected = state;

    if (connected) {

        connection.innerHTML =
        "ESP8266 Connected";

        connection.style.color =
        "#4ade80";

        button.disabled = busy;

    }

    else {

        connection.innerHTML =
        "ESP8266 Disconnected";

        connection.style.color =
        "#f87171";

        button.disabled = true;

    }

}


// =====================================
// Get LED Status
// =====================================

async function getStatus() {

    try {

        const response = await fetch(
            ESP_URL + "/status",
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Server Error");
        }

        const data =
        (await response.text()).trim();

        if (data !== "ON" && data !== "OFF") {
            throw new Error("Invalid Response");
        }

        led = (data === "ON");

        updateUI();

        updateConnection(true);

    }

    catch(error) {

        updateConnection(false);

    }

}


// =====================================
// Toggle LED
// =====================================

async function toggleLED() {

    if (!connected || busy) return;

    busy = true;

    button.disabled = true;

    try {

        const response = await fetch(
            ESP_URL + "/toggle",
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Toggle Failed");
        }

        const data =
        (await response.text()).trim();

        if (data !== "ON" && data !== "OFF") {
            throw new Error("Invalid Response");
        }

        led = (data === "ON");

        updateUI();

        updateConnection(true);

    }

    catch(error) {

        updateConnection(false);

    }

    finally {

        busy = false;

        button.disabled = !connected;

    }

}


// =====================================
// Initial Status
// =====================================

getStatus();


// =====================================
// Automatic Status Refresh
// =====================================

setInterval(getStatus, 3000);

</script>

</body>

</html>
